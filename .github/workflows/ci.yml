name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Tests, Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd server && npm ci

      - name: Run backend lint
        run: cd server && npm run lint

      - name: Run backend Prettier check
        run: cd server && npm run format:check

      - name: Run backend tests
        run: cd server && npm test

  frontend:
    name: Frontend Tests, Lint, Format & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd client && npm ci

      - name: Run frontend lint
        run: cd client && npm run lint

      - name: Run frontend Prettier check
        run: cd client && npm run format:check

      - name: Run frontend unit tests
        run: cd client && npm test -- --run

      - name: Build frontend
        run: cd client && npm run build

  