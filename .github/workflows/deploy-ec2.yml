name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    if: ${{ secrets.EC2_HOST != '' && secrets.EC2_USER != '' && secrets.EC2_DEPLOY_PATH != '' && (secrets.EC2_SSH_PRIVATE_KEY != '' || secrets.SSH_PRIVATE_KEY != '') }}
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Sync repository to EC2
        run: |
          rsync -az --delete --exclude='.git' --exclude='node_modules' --exclude='.github' ./ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}

      - name: Run remote deploy script
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'EOF'
            set -e
            export DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            cd "${DEPLOY_PATH}"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          EOF
