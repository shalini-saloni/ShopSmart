name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate EC2 deployment secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_USER }}" ] || [ -z "${{ secrets.EC2_DEPLOY_PATH }}" ] || (
            [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]
          ); then
            echo "Missing required EC2 secrets. Please add EC2_HOST, EC2_USER, EC2_DEPLOY_PATH, and either EC2_SSH_PRIVATE_KEY or SSH_PRIVATE_KEY."
            exit 1
          fi
        shell: bash

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Sync repository to EC2
        run: |
          rsync -az --delete --exclude='.git' --exclude='node_modules' --exclude='.github' ./ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}

      - name: Run remote deploy script
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'EOF'
            set -e
            export DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            cd "${DEPLOY_PATH}"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          EOF
